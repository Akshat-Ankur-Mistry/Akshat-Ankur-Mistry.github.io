        setStage('<div class="pane">' + main + '</div>');
        setFooter('', '', footerRight);
    }

    window.beginAutomatedTraining = function () {
        var input = document.getElementById('totalMergesInput');
        var n = input ? parseInt(input.value, 10) : 100;
        if (isNaN(n)) n = 100;
        if (n < 100) n = 100; if (n > 500) n = 500;
        S.trainConfig.totalMerges = n;
        var remaining = Math.max(0, n - S.merges.length);
        S.stage4 = 'progress'; S.trainProgress = { exhaustedEarly: false };
        renderScreen4();
        runAutomatedTraining(remaining);
    };
    function runAutomatedTraining(remaining) {
        if (remaining <= 0) { setTimeout(function () { S.screen = 5; renderScreen5(); }, 300); return; }
        var batchSize = Math.max(1, Math.ceil(remaining / 60));
        function tick() {
            var doneThisBatch = 0, exhausted = false;
            while (doneThisBatch < batchSize && remaining > 0) {
                var counts = computeCounts(S.uniqueChunks); var tp = topPairFromCounts(counts);
                if (!tp) { exhausted = true; break; }
                performOneMerge(tp); doneThisBatch++; remaining--;
            }
            if (exhausted) S.trainProgress.exhaustedEarly = true;
            renderScreen4();
            if (!exhausted && remaining > 0) setTimeout(tick, 30);
            else setTimeout(function () { S.screen = 5; renderScreen5(); }, 500);
        }
        tick();
    }

    /* =========================================================================
       SCREEN 5: Final vocabulary (full, untruncated)
       ========================================================================= */
    function renderScreen5() {
        setChrome(false);
        var totalBytes = S.uniqueChunks.reduce(function (s, uc) { return s + uc.bytes.length * uc.count; }, 0);
        var totalTokensNow = S.uniqueChunks.reduce(function (s, uc) { return s + uc.tokens.length * uc.count; }, 0);
        var ratio = totalTokensNow > 0 ? (totalBytes / totalTokensNow) : 0;
        var lastMerge = S.merges.length ? S.merges[S.merges.length - 1] : null;
        var html = '' +
            '<h2 class="stage-title">Merges learned</h2>' +
            '<p class="lede">Each row is one training step: the most frequent pair at that point became a new token.</p>' +
            '<div class="stat-row">' +
            '<div class="stat"><div class="num">' + S.merges.length + '</div><div class="lbl">merges</div></div>' +
            '<div class="stat"><div class="num">' + S.vocab.length + '</div><div class="lbl">tokens</div></div>' +
            '<div class="stat"><div class="num">' + ratio.toFixed(2) + '</div><div class="lbl">bytes / token</div></div>' +
            '</div>' +
            '<div class="scroll"><table class="fx-table vocab-table">' + mergeTableHead() + '<tbody>' + renderMergeRows(S.merges, lastMerge ? lastMerge.newId : null) + '</tbody></table></div>';
        setStage(html);
        setFooter('', '', '<button class="primary" onclick="goToScreen6()">Try it</button>');
    }

    /* =========================================================================
       SCREEN 6: Try it (free-scroll, exempt from the fixed box)
       ========================================================================= */
    var S6_MANUAL_MERGES = 3;

    // Reuses the same six pastel hues as the chunk-boundary highlighting on
    // screens 1-4 (var(--c1) .. var(--c6)) so the "which chunk is active" color
    // on screen 6 draws from the same palette as the rest of the simulator.
    var S6_CHUNK_PASTELS = [
        'var(--c1)',
        'var(--c2)',
        'var(--c3)',
        'var(--c4)',
        'var(--c5)',
        'var(--c6)'
    ];

    window.goToScreen6 = function () {
        S.screen = 6;
        S.testResult = null;
        S.lookupSim = null;
        renderScreen6();
    };

    window.onTestInput = function (value) {
        S.testText = value;
    };

    window.s6TryAnotherInput = function () {
        S.testText = '';
        S.testResult = null;
        S.lookupSim = null;
        renderScreen6();
    };

    window.s6RestartSimulation = function () {
        tokenizeTestText();
    };

    function s6StepBlock(title, bodyHtml) {
        return '<div style="margin-bottom:18px;color:var(--ink);">' +
            '<div class="pane-title" style="margin-bottom:7px;color:var(--ink);">' +
            title +
            '</div>' +
            bodyHtml +
            '</div>';
    }

    function s6CellScroll(valueHtml) {
        return '<div style="' +
            'display:block;box-sizing:border-box;min-width:0;width:100%;' +
            'max-width:100%;overflow-x:auto;overflow-y:hidden;' +
            'white-space:nowrap;color:var(--ink);">' +
            valueHtml +
            '</div>';
    }

    function s6TableCell(valueHtml) {
        return '<td style="overflow:hidden;color:var(--ink);">' +
            s6CellScroll(valueHtml) +
            '</td>';
    }

    function s6ArrayText(tokens) {
        return '[' +
            escapeHtml((tokens || []).join(', ')) +
            ']';
    }

    function s6ChunkColor(state) {
        return state && state.pastel ?
            state.pastel :
            'var(--paper)';
    }

    function s6ChoosePastel(previous) {
        var choices = S6_CHUNK_PASTELS.filter(function (color) {
            return color !== previous;
        });

        if (!choices.length) {
            choices = S6_CHUNK_PASTELS.slice();
        }

        return choices[
            Math.floor(Math.random() * choices.length)
            ];
    }

    function s6Notice(message, state) {
        return '<div style="' +
            'box-sizing:border-box;padding:9px 11px;margin-bottom:10px;' +
            'background:' + s6ChunkColor(state) + ';' +
            'border-left:4px solid var(--accent);' +
            'border-radius:5px;color:var(--ink);">' +
            message +
            '</div>';
    }

    function s6ArrayChips(tokens, highlights, pastel) {
        var highlighted = {};

        (highlights || []).forEach(function (index) {
            highlighted[index] = true;
        });

        var values = (tokens || []).map(function (token, index) {
            var active = highlighted[index];

            return '<span class="mono" style="' +
                'display:inline-block;padding:3px 6px;margin:2px;' +
                'border:1px solid var(--line);border-radius:4px;' +
                'background:' + (active ? pastel : 'var(--card)') + ';' +
                'color:var(--ink);' +
                (active ?
                    'border-color:var(--accent);font-weight:700;' :
                    '') +
                '">' +
                escapeHtml(String(token)) +
                '</span>' +
                (index < tokens.length - 1 ?
                    '<span class="mono" style="color:var(--ink);">, </span>' :
                    '');
        }).join('');

        return '<div style="' +
            'max-width:100%;overflow-x:auto;overflow-y:hidden;' +
            'white-space:nowrap;padding:2px 0;color:var(--ink);">' +
            '<span class="mono">[</span>' +
            values +
            '<span class="mono">]</span>' +
            '</div>';
    }

    function s6PairPosition(tokens, left, right) {
        for (var i = 0; i < tokens.length - 1; i++) {
            if (tokens[i] === left && tokens[i + 1] === right) {
                return i;
            }
        }

        return -1;
    }

    function s6PairIndices(tokens, left, right) {
        var indices = [];

        for (var i = 0; i < tokens.length - 1; i++) {
            if (tokens[i] === left && tokens[i + 1] === right) {
                indices.push(i, i + 1);
                i++;
            }
        }

        return indices;
    }

    function s6MergedIndices(tokens, left, right) {
        var indices = [];
        var outputIndex = 0;

        for (var i = 0; i < tokens.length; i++) {
            if (
                i < tokens.length - 1 &&
                tokens[i] === left &&
                tokens[i + 1] === right
            ) {
                indices.push(outputIndex);
                outputIndex++;
                i++;
            } else {
                outputIndex++;
            }
        }

        return indices;
    }

    function s6MergeAllPairs(tokens, left, right, newId) {
        var output = [];
        var matched = false;

        for (var i = 0; i < tokens.length; i++) {
            if (
                i < tokens.length - 1 &&
                tokens[i] === left &&
                tokens[i + 1] === right
            ) {
                output.push(newId);
                matched = true;
                i++;
            } else {
                output.push(tokens[i]);
            }
        }

        return {
            matched: matched,
            tokens: output
        };
    }

    function s6ApplyRule(state, rule) {
        var before = state.tokens.slice();
        var result = s6MergeAllPairs(
            before,
            rule.left,
            rule.right,
            rule.newId
        );

        if (result.matched) {
            state.tokens = result.tokens;
            state.matchCount++;
        }

        return {
            matched: result.matched,
            before: before,
            after: state.tokens.slice(),
            oldHighlight: result.matched ?
                s6PairIndices(before, rule.left, rule.right) :
                [],
            newHighlight: result.matched ?
                s6MergedIndices(before, rule.left, rule.right) :
                []
        };
    }

    function s6RuleText(rule) {
        var left = S.vocab[rule.left];
        var right = S.vocab[rule.right];

        return escapeHtml(
            (left ? left.display : '') +
            (right ? right.display : '')
        );
    }

    function s6Snapshot() {
        var sim = S.lookupSim;

        return JSON.parse(JSON.stringify({
            chunks: sim.chunks,
            activeChunk: sim.activeChunk,
            currentMergeId: sim.currentMergeId,
            done: sim.done,
            finalized: sim.finalized
        }));
    }

    function s6PushHistory() {
        if (S.lookupSim) {
            S.lookupSim.history.push(s6Snapshot());
        }
    }

    function s6CreateSkipToken() {
        return {
            requestSkip: function () {
                s6AutoEncodeFromHereCore(false);
            }
        };
    }

    function s6CheckMerge(state, mergeIndex, skippedFrom, skippedTo) {
        var rule = S.merges[mergeIndex];
        var result = s6ApplyRule(state, rule);

        state.cursor = mergeIndex + 1;
        state.complete = false;
        state.last = {
            type: 'merge',
            rule: rule,
            matched: result.matched,
            before: result.before,
            after: result.after,
            oldHighlight: result.oldHighlight,
            newHighlight: result.newHighlight,
            skippedFrom: skippedFrom == null ? null : skippedFrom,
            skippedTo: skippedTo == null ? null : skippedTo
        };

        S.lookupSim.currentMergeId = rule.mergeId;
    }

    function s6FinishChunk(state) {
        var lastRule = S.merges[S.merges.length - 1];

        state.cursor = S.merges.length;
        state.complete = true;
        state.last = {
            type: 'complete',
            mergeId: lastRule ? lastRule.mergeId : null
        };

        S.lookupSim.currentMergeId =
            lastRule ? lastRule.mergeId : null;
    }

    function s6NextApplicableMerge(state) {
        var start = state.cursor;

        for (var i = start; i < S.merges.length; i++) {
            var rule = S.merges[i];

            if (
                s6PairPosition(
                    state.tokens,
                    rule.left,
                    rule.right
                ) !== -1
            ) {
                s6CheckMerge(
                    state,
                    i,
                    i > start ? S.merges[start].mergeId : null,
                    i > start ? S.merges[i - 1].mergeId : null
                );
                return;
            }
        }

        s6FinishChunk(state);
    }

    function s6SweepChunkFromCursor(state) {
        while (state.cursor < S.merges.length) {
            var mergeIndex = state.cursor;
            var rule = S.merges[mergeIndex];

            s6ApplyRule(state, rule);
            state.cursor = mergeIndex + 1;
        }

        s6FinishChunk(state);
    }

    function s6RebuildFinalOutput() {
        var sim = S.lookupSim;
        var stream = [];
        var decodedBytes = [];

        sim.chunks.forEach(function (state, index) {
            S.testResult.perChunk[index].tokens =
                state.tokens.slice();

            stream = stream.concat(state.tokens);
        });

        stream.forEach(function (tokenId) {
            if (S.vocab[tokenId]) {
                decodedBytes = decodedBytes.concat(
                    S.vocab[tokenId].bytes
                );
            }
        });

        var decoder = new TextDecoder(
            S.encoding === 'utf-16' ?
                'utf-16le' :
                'utf-8',
            { fatal: false }
        );

        var decoded = decoder.decode(
            new Uint8Array(decodedBytes)
        );

        S.testResult.allTokens = stream;
        S.testResult.ratio = stream.length ?
            S.testResult.totalBytes / stream.length :
            0;
        S.testResult.roundTripOk =
            decoded === S.testText;
    }

    function s6FinalizeResult() {
        var sim = S.lookupSim;

        if (!sim || sim.finalized) {
            return;
        }

        s6RebuildFinalOutput();
        sim.finalized = true;
        sim.done = true;
        sim.currentMergeId = null;
    }

    // Core implementation, called only by its own distinct name (never through
    // window.s6AutoEncodeFromHere, which is a separate public wrapper below -
    // keeping them separate avoids a name collision that previously caused
    // infinite recursion whenever "Auto encode from here" was clicked).
    function s6AutoEncodeFromHereCore(recordHistory) {
        var sim = S.lookupSim;

        if (!sim || sim.done) {
            return;
        }

        if (recordHistory) {
            s6PushHistory();
        }

        for (
            var i = sim.activeChunk;
            i < sim.chunks.length;
            i++
        ) {
            if (!sim.chunks[i].complete) {
                s6SweepChunkFromCursor(sim.chunks[i]);
            }
        }

        s6FinalizeResult();
        renderScreen6();
    }

    function s6NextLookupStep() {
        var sim = S.lookupSim;

        if (!sim || sim.done) {
            return;
        }

        s6PushHistory();

        var state = sim.chunks[sim.activeChunk];

        if (state.complete) {
            if (sim.activeChunk < sim.chunks.length - 1) {
                sim.activeChunk++;
                sim.currentMergeId =
                    S.merges.length ?
                        S.merges[0].mergeId :
                        null;
            } else {
                s6FinalizeResult();
            }

            renderScreen6();
            return;
        }

        var manualLimit = Math.min(
            S6_MANUAL_MERGES,
            S.merges.length
        );

        if (state.cursor < manualLimit) {
            s6CheckMerge(
                state,
                state.cursor,
                null,
                null
            );
        } else {
            s6NextApplicableMerge(state);
        }

        renderScreen6();
    }

    function s6BackLookupStep() {
        var sim = S.lookupSim;

        if (!sim || !sim.history.length) {
            return;
        }

        var previous = sim.history.pop();

        previous.history = sim.history;
        previous.token = s6CreateSkipToken();
        S.lookupSim = previous;

        renderScreen6();
    }

    window.s6NextLookupStep = s6NextLookupStep;
    window.s6BackLookupStep = s6BackLookupStep;
    // Public entry point for the "Auto encode from here" button. Always records
    // history (the user explicitly chose to jump ahead, so Back should return
    // them to where they were).
    window.s6AutoEncodeFromHere = function () {
        s6AutoEncodeFromHereCore(true);
    };

    function s6VocabularyTable(state) {
        var sim = S.lookupSim;
        var pastel = s6ChunkColor(state);

        var rows = S.merges.map(function (rule) {
            var active =
                rule.mergeId === sim.currentMergeId;

            var rowStyle = active ?
                'background:' + pastel +
                ';box-shadow:inset 4px 0 0 var(--accent);' :
                '';

            return '<tr id="s6-vocab-row-' +
                rule.mergeId +
                '" style="' +
                rowStyle +
                'color:var(--ink);"' +
                (active ? ' aria-current="step"' : '') +
                '>' +
                s6TableCell(
                    '<span class="mono">' +
                    rule.mergeId +
                    '</span>'
                ) +
                s6TableCell(
                    '<span class="mono">' +
                    rule.newId +
                    '</span>'
                ) +
                s6TableCell(
                    '<span class="mono">[' +
                    rule.left +
                    ', ' +
                    rule.right +
                    ']</span>'
                ) +
                s6TableCell(
                    s6RuleText(rule)
                ) +
                '</tr>';
        }).join('');

        return '<div class="scroll short" id="s6VocabularyBox">' +
            '<table class="fx-table vocab-table" style="' +
            'table-layout:fixed;width:100%;color:var(--ink);">' +
            colgroupHtml([16, 18, 25, 41]) +
            '<thead><tr>' +
            '<th>mergeId</th>' +
            '<th>tokenId</th>' +
            '<th>pair</th>' +
            '<th>text</th>' +
            '</tr></thead>' +
            '<tbody>' +
            rows +
            '</tbody>' +
            '</table>' +
            '</div>';
    }

    function s6ChunkComparison(state) {
        var message = state.matchCount === 0 ?
            'We swept through all the learned merges, but no matching pair was found; this chunk remains as its base tokenIds.' :
            'The learned-merge sweep is complete for this chunk.';

        return s6Notice(message, state) +
            '<table class="fx-table" style="' +
            'table-layout:fixed;width:100%;color:var(--ink);">' +
            colgroupHtml([50, 50]) +
            '<thead><tr>' +
            '<th>Original base tokenIds</th>' +
            '<th>After learned-merge sweep</th>' +
            '</tr></thead>' +
            '<tbody><tr>' +
            s6TableCell(
                '<span class="mono">' +
                s6ArrayText(state.baseTokens) +
                '</span>'
            ) +
            s6TableCell(
                '<span class="mono">' +
                s6ArrayText(state.tokens) +
                '</span>'
            ) +
            '</tr></tbody>' +
            '</table>';
    }

    function s6MergeResult(state) {
        var last = state.last;

        if (!last || last.type !== 'merge') {
            return '';
        }

        if (!last.matched) {
            return s6Notice(
                'No match found for mergeId ' +
                last.rule.mergeId +
                '.',
                state
            );
        }

        var rule = last.rule;
        var message;

        if (
            last.skippedFrom !== null &&
            last.skippedTo !== null
        ) {
            message =
                'No match found for mergeIds ' +
                last.skippedFrom +
                '&ndash;' +
                last.skippedTo +
                '; next applicable mergeId is mergeId ' +
                rule.mergeId +
                ', so tokenId pair [' +
                rule.left +
                ', ' +
                rule.right +
                '] &rarr; tokenId ' +
                rule.newId +
                '.';
        } else {
            message =
                'tokenId pair [' +
                rule.left +
                ', ' +
                rule.right +
                '] &rarr; tokenId ' +
                rule.newId +
                '.';
        }

        return s6Notice(message, state) +
            '<div style="margin-top:8px;color:var(--ink);">' +
            '<div class="small-label" style="color:var(--ink);">' +
            'Previous token IDs' +
            '</div>' +
            s6ArrayChips(
                last.before,
                last.oldHighlight,
                s6ChunkColor(state)
            ) +
            '<div style="margin:3px 0;color:var(--ink);">' +
            '&darr;' +
            '</div>' +
            '<div class="small-label" style="color:var(--ink);">' +
            'Current token IDs' +
            '</div>' +
            s6ArrayChips(
                last.after,
                last.newHighlight,
                s6ChunkColor(state)
            ) +
            '</div>';
    }

    function s6LookupBlock() {
        var sim = S.lookupSim;
        var state = sim.chunks[sim.activeChunk];

        if (state.complete) {
            return s6StepBlock(
                'Chunk ' +
                (sim.activeChunk + 1) +
                ' complete',
                s6ChunkComparison(state)
            );
        }

        return s6StepBlock(
            'Vocabulary lookup &mdash; chunk ' +
            (sim.activeChunk + 1),

            '<div class="sim-frame" style="color:var(--ink);">' +
            '<div style="' +
            'background:' + s6ChunkColor(state) + ';' +
            'padding:8px 10px;border-left:4px solid var(--accent);' +
            'color:var(--ink);">' +
            '<strong>Selected chunk:</strong> ' +
            '<span class="mono">&quot;' +
            escapeHtml(visibleChars(state.chunk)) +
            '&quot;: ' +
            s6ArrayText(state.baseTokens) +
            '</span>' +
            '</div>' +

            '<p style="margin:10px 0 8px;color:var(--ink);">' +
            'We iterate through mergeId 1 to ' +
            S.merges.length +
            ' for the selected chunk tokenId array.' +
            '</p>' +

            s6MergeResult(state) +

            '<div style="margin-top:12px;">' +
            s6VocabularyTable(state) +
            '</div>' +
            '</div>'
        );
    }

    function s6WordCount(text) {
        var words = String(text || '').match(/\S+/g);
        return words ? words.length : 0;
    }

    function s6MetricCard(label, value, detail) {
        return '<div style="' +
            'flex:1 1 145px;min-width:145px;padding:11px;' +
            'border:1px solid var(--line);background:var(--paper);' +
            'color:var(--ink);">' +
            '<div style="font-size:12px;color:var(--ink);">' +
            label +
            '</div>' +
            '<div style="font-size:19px;font-weight:700;' +
            'margin-top:4px;color:var(--ink);">' +
            value +
            '</div>' +
            '<div style="font-size:11px;margin-top:3px;color:var(--ink);">' +
            detail +
            '</div>' +
            '</div>';
    }

    function s6Metrics() {
        var result = S.testResult;
        var baseCount = result.perChunk.reduce(function (sum, item) {
            return sum + item.baseTokens.length;
        }, 0);

        var finalCount = result.allTokens.length;
        var reduction = baseCount - finalCount;
        var reductionRate = baseCount ?
            ((reduction / baseCount) * 100).toFixed(1) :
            '0.0';

        var words = s6WordCount(S.testText);
        var bytesPerWord = words ?
            (result.totalBytes / words).toFixed(1) :
            '&mdash;';

        return s6StepBlock(
            'Output metrics',

            '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
            s6MetricCard(
                'Original base tokenIds',
                baseCount,
                'Before learned merges'
            ) +
            s6MetricCard(
                'Final tokenIds',
                finalCount,
                'After the merge sweep'
            ) +
            s6MetricCard(
                'Reduction rate',
                reductionRate + '%',
                reduction + ' fewer tokenIds'
            ) +
            s6MetricCard(
                'Bytes per word',
                bytesPerWord,
                words ?
                    result.totalBytes + ' bytes / ' + words + ' words' :
                    'No words detected'
            ) +
            '</div>'
        );
    }

    function s6FinalBlock() {
        var sim = S.lookupSim;
        var result = S.testResult;

        var rows = sim.chunks.map(function (state) {
            return '<tr>' +
                s6TableCell(
                    '<span class="mono">' +
                    escapeHtml(visibleChars(state.chunk)) +
                    '</span>'
                ) +
                s6TableCell(
                    '<span class="mono">' +
                    s6ArrayText(state.baseTokens) +
                    '</span>'
                ) +
                s6TableCell(
                    '<span class="mono">' +
                    s6ArrayText(state.tokens) +
                    '</span>'
                ) +
                '</tr>';
        }).join('');

        return s6StepBlock(
                'Final tokenization by chunk',

                '<div class="scroll short">' +
                '<table class="fx-table" style="' +
                'table-layout:fixed;width:100%;color:var(--ink);">' +
                colgroupHtml([23, 38, 39]) +
                '<thead><tr>' +
                '<th>Chunk</th>' +
                '<th>Original base tokenIds</th>' +
                '<th>After learned-merge sweep</th>' +
                '</tr></thead>' +
                '<tbody>' +
                rows +
                '</tbody>' +
                '</table>' +
                '</div>'
            ) +

            s6StepBlock(
                'Token-ID stream combined in original input order',

                '<div class="scroll short" style="' +
                'padding:12px;color:var(--ink);">' +
                '<span class="mono">' +
                s6ArrayText(result.allTokens) +
                '</span>' +
                '</div>'
            ) +

            s6Metrics() +

            '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="primary" onclick="s6RestartSimulation()">' +
            'Replay this input' +
            '</button>' +
            '<button onclick="s6TryAnotherInput()">' +
            'Try another example' +
            '</button>' +
            '<button class="ghost" onclick="startOver()">' +
            'Start over' +
            '</button>' +
            '</div>';
    }

    function s6FocusVocabularyRow() {
        var sim = S.lookupSim;

        if (
            !sim ||
            sim.done ||
            sim.currentMergeId === null
        ) {
            return;
        }

        setTimeout(function () {
            var row = document.getElementById(
                's6-vocab-row-' + sim.currentMergeId
            );
            var box = document.getElementById(
                's6VocabularyBox'
            );

            if (!row || !box) {
                return;
            }

            box.scrollTop = Math.max(
                0,
                row.offsetTop -
                box.clientHeight / 2 +
                row.offsetHeight / 2
            );
        }, 0);
    }

    function s6BaseTokenTable() {
        var sim = S.lookupSim;
        var result = S.testResult;
        var activeChunk =
            sim && !sim.done ?
                sim.activeChunk :
                -1;

        var rows = result.perChunk.map(function (item, index) {
            var state = sim ? sim.chunks[index] : null;
            var active = index === activeChunk;
            var rowStyle = active ?
                'background:' + s6ChunkColor(state) +
                ';box-shadow:inset 4px 0 0 var(--accent);' :
                '';

            return '<tr style="' + rowStyle + '"' +
                (active ? ' aria-current="step"' : '') +
                '>' +
                s6TableCell(
                    '<span class="mono">' +
                    escapeHtml(visibleChars(item.chunk)) +
                    '</span>'
                ) +
                s6TableCell(
                    '<span class="mono">' +
                    s6ArrayText(item.baseTokens) +
                    '</span>'
                ) +
                '</tr>';
        }).join('');

        return s6StepBlock(
            'Base tokenIds by chunk',

            '<div class="scroll short">' +
            '<table class="fx-table" style="' +
            'table-layout:fixed;width:100%;color:var(--ink);">' +
            colgroupHtml([35, 65]) +
            '<thead><tr>' +
            '<th>Chunk</th>' +
            '<th>Base tokenIds</th>' +
            '</tr></thead>' +
            '<tbody>' +
            rows +
            '</tbody>' +
            '</table>' +
            '</div>'
        );
    }

    function s6RenderFooter() {
        var sim = S.lookupSim;

        if (!S.testResult || S.testResult.error || !sim || sim.done) {
            setFooter('', '', '');
            return;
        }

        var state = sim.chunks[sim.activeChunk];
        var manualLimit = Math.min(
            S6_MANUAL_MERGES,
            S.merges.length
        );
        var label;

        if (state.complete) {
            label =
                sim.activeChunk < sim.chunks.length - 1 ?
                    'Next chunk' :
                    'Finish';
        } else if (state.cursor < manualLimit) {
            label =
                'Check mergeId ' +
                S.merges[state.cursor].mergeId;
        } else {
            label = 'Next applicable merge';
        }

        setFooter(
            '<button onclick="s6BackLookupStep()"' +
            (sim.history.length ? '' : ' disabled') +
            '>&larr; Back</button>',

            'Chunk ' +
            (sim.activeChunk + 1) +
            ' / ' +
            sim.chunks.length,

            '<button class="primary" onclick="s6NextLookupStep()">' +
            label +
            '</button>' +
            '<button onclick="s6AutoEncodeFromHere()">' +
            'Auto encode from here' +
            '</button>'
        );
    }

    function renderTestResultInto() {
        var area = document.getElementById(
            'testResultArea'
        );

        if (!area) {
            return;
        }

        if (!S.testResult) {
            area.innerHTML = '';
            s6RenderFooter();
            return;
        }

        if (S.testResult.error) {
            area.innerHTML =
                '<div class="msg error" style="color:var(--ink);">' +
                escapeHtml(S.testResult.error) +
                '</div>';

            s6RenderFooter();
            return;
        }

        var sim = S.lookupSim;

        if (sim && sim.done) {
            area.innerHTML = s6FinalBlock();
            s6RenderFooter();
            return;
        }

        var html = s6BaseTokenTable();

        if (sim) {
            html += s6LookupBlock();
        }

        area.innerHTML = html;
        s6RenderFooter();
        s6FocusVocabularyRow();
    }

    function renderScreen6() {
        setChrome(true);

        if (S.testResult) {
            setStage(
                '<div id="testResultArea" style="color:var(--ink);"></div>'
            );
            renderTestResultInto();
            return;
        }

        setStage(
            '<div style="color:var(--ink);">' +
            '<h2 class="stage-title">Try it</h2>' +
            '<textarea id="testBox" rows="3" ' +
            'oninput="onTestInput(this.value)">' +
            escapeHtml(S.testText || '') +
            '</textarea>' +
            '<div style="margin-top:10px;">' +
            '<button class="primary" onclick="tokenizeTestText()">' +
            'Tokenize' +
            '</button>' +
            '</div>' +
            '<div id="testResultArea" style="margin-top:18px;"></div>' +
            '</div>'
        );

        renderTestResultInto();
    }

    window.tokenizeTestText = function () {
        var text = String(S.testText || '');

        if (S.encoding === 'ascii') {
            var check = canEncodeAscii(text);

            if (!check.ok) {
                var shown = check.badChars.slice(0, 6);
                var quoted = shown.map(function (character) {
                    return '"' + character + '"';
                }).join(', ');

                S.testResult = {
                    error:
                        'Non-ASCII character(s) detected: {' +
                        quoted +
                        (check.badChars.length > shown.length ? ', …' : '') +
                        '}. Requires UTF-8 or UTF-16 encoding.'
                };

                S.lookupSim = null;
                renderScreen6();
                return;
            }
        }

        var chunks = chunkify(text);
        var previousPastel = null;

        var perChunk = chunks.map(function (chunk) {
            var bytes = encodeString(chunk, S.encoding);
            var baseTokens = bytes.map(function (byte) {
                return S.byteToTokenId[byte];
            });
            var pastel = s6ChoosePastel(previousPastel);

            previousPastel = pastel;

            return {
                chunk: chunk,
                bytes: bytes,
                baseTokens: baseTokens,
                tokens: baseTokens.slice(),
                pastel: pastel
            };
        });

        var totalBytes = perChunk.reduce(function (sum, item) {
            return sum + item.bytes.length;
        }, 0);

        S.testResult = {
            chunks: chunks,
            perChunk: perChunk,
            allTokens: [],
            totalBytes: totalBytes,
            ratio: 0,
            roundTripOk: false
        };

        S.lookupSim = {
            chunks: perChunk.map(function (item) {
                return {
                    chunk: item.chunk,
                    baseTokens: item.baseTokens.slice(),
                    tokens: item.baseTokens.slice(),
                    pastel: item.pastel,
                    cursor: 0,
                    matchCount: 0,
                    complete: false,
                    last: null
                };
            }),
            activeChunk: 0,
            currentMergeId:
                S.merges.length ?
                    S.merges[0].mergeId :
                    null,
            done: false,
            finalized: false,
            history: [],
            token: null
        };

        S.lookupSim.token = s6CreateSkipToken();

        if (!S.lookupSim.chunks.length || !S.merges.length) {
            S.lookupSim.chunks.forEach(function (state) {
                s6FinishChunk(state);
            });

            s6FinalizeResult();
        }

        renderScreen6();
    };

    window.skipLookupSim = function () { if (S.lookupSim && S.lookupSim.token) S.lookupSim.token.requestSkip(); };

    window.startOver = function () { S = freshState(); renderScreen1(); };

    /* =========================================================================
       INFO POPOVERS (generic - used by the chunking regex explainer, the pair
       counts method explainer, and the vocabulary-permutation explainer). Each
       info button carries data-pop="<id-of-its-popover>"; toggling one closes
       any other that's open.
       ========================================================================= */
    window.toggleInfoPop = function (e, popId) {
        if (e) e.stopPropagation();
        var pop = document.getElementById(popId);
        if (!pop) return;
        var opening = (pop.style.display === 'none' || !pop.style.display);
        document.querySelectorAll('.info-pop').forEach(function (p) {
            if (p !== pop) {
                p.style.display = 'none';
                var otherBtn = document.querySelector('[data-pop="' + p.id + '"]');
                if (otherBtn) otherBtn.setAttribute('aria-expanded', 'false');
            }
        });
        pop.style.display = opening ? 'block' : 'none';
        var btn = document.querySelector('[data-pop="' + popId + '"]');
        if (btn) btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
    };
    document.addEventListener('click', function (e) {
        document.querySelectorAll('.info-pop').forEach(function (pop) {
            if (pop.style.display === 'none' || !pop.style.display) return;
            if (pop.contains(e.target)) return;
            var btn = document.querySelector('[data-pop="' + pop.id + '"]');
            if (btn && (e.target === btn || btn.contains(e.target))) return;
            pop.style.display = 'none';
            if (btn) btn.setAttribute('aria-expanded', 'false');
        });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        document.querySelectorAll('.info-pop').forEach(function (pop) {
            pop.style.display = 'none';
            var btn = document.querySelector('[data-pop="' + pop.id + '"]');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        });
    });

    /* =========================================================================
       BOOT
       ========================================================================= */
    renderScreen1();
</script>
</body>
